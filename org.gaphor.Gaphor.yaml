app-id: org.gaphor.Gaphor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gaphor
finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --device=dri
  - --filesystem=home
cleanup:
  - /include
modules:
  - graphviz.yaml
  - gaphor-bin.yaml
  - name: gaphor-extras
    buildsystem: simple
    build-commands:
      - desktop-file-edit --remove-key=DBusActivatable data/org.gaphor.Gaphor.desktop
      - install -Dm644 data/org.gaphor.Gaphor.appdata.xml -t /app/share/metainfo/
      - install -Dm644 data/org.gaphor.Gaphor.desktop -t /app/share/applications/
      - install -Dm644 data/org.gaphor.Gaphor.xml -t /app/share/mime/packages/
      - install -Dm644 data/logos/org.gaphor.Gaphor.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 data/logos/org.gaphor.Gaphor-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps/
      - gaphor install-schemas --schemas-dir=/app/share/glib-2.0/schemas
    sources:
      - type: git
        url: https://github.com/gaphor/gaphor.git
        tag: 3.3.0
        commit: 7c747fb483fe789046346d5f1f522e9a7316972f
