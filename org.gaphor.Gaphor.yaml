app-id: org.gaphor.Gaphor
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: gaphor
finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --device=dri
  - --filesystem=home
cleanup:
  - /include
modules:
  - graphviz.yaml
  - gaphor-bin.yaml
  - gaphor-shared.yaml
  - name: post-install
    buildsystem: simple
    build-commands:
      - gaphor install-schemas --schemas-dir=/app/share/glib-2.0/schemas
      - find ${FLATPAK_DEST}/lib -path '*/gaphor/locale/*/LC_MESSAGES/gaphor.mo' -exec sh -c 'lang=$(basename $(dirname $(dirname $1))); install -Dm644 $1 ${FLATPAK_DEST}/share/locale/$lang/LC_MESSAGES/gaphor.mo' _ {} \;
