name: graphviz
buildsystem: simple
build-commands:
  - tar xf graphviz-16.1.2.tar.xz
  - cd graphviz-16.1.2 && ./configure --prefix=${FLATPAK_DEST}  --without-x --with-qt=no --with-gtk=no --enable-swig=no --with-webp=no --with-rsvg=no --with-visio=no --with-gdk-pixbuf=no --with-pangocairo=no
  - cd graphviz-16.1.2 && make install
cleanup:
  - /share/man
  - /share/graphviz
sources:
  - type: file
    url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.2/graphviz-16.1.2.tar.xz
    sha256: 9780938f03659e2effbbfbbaec94940108e794199b73196fa339ca911890e8c9
